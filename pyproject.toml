[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opensat"
version = "0.1.0"
description = "Local-first SAT Reading and Writing diagnostic practice engine"
requires-python = ">=3.9"
dependencies = ["wordfreq==3.1.1"]
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
